<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/style.css">
    <title>GoRka Kebab</title>
</head>
<body>
    <div class="page-bg"></div>

    <div id="menu-screen">
        <header>
            <div class="container">
    <div class="row">
        <div class="col-12 text-center">
            <h1 class="text-center cim text-white fw-bold p-4"><span class="nev">GoRka </span>Kebab</h1>
            <img src="img/gorkakebab (2).png" alt="GoRka Kebab Logo" class="img-fluid" style="max-width: 250px;">
        </div>
    </div>
</div>
        </header>
        <main>
            <section class="text-center mt-5">
                <button id="start-btn" type="button" class="btn text-white p-3 w-25 fs-3 fw-bold jatek">Játék</button><br>
                
                <div class="dropdown d-inline-block w-25 mt-5">
                    <button id="difficulty-btn" class="btn nehezseg text-white p-3 w-100 fs-3 fw-bold dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false">
                        Nehézség
                    </button>
                    <ul class="dropdown-menu dropd w-100 text-center">
                        <li><a class="dropdown-item text-white fw-bold" href="#" data-diff="Könnyű">Könnyű</a></li>
                        <li><a class="dropdown-item text-white fw-bold" href="#" data-diff="Közepes">Közepes</a></li>
                        <li><a class="dropdown-item text-white fw-bold" href="#" data-diff="Nehéz">Nehéz</a></li>
                    </ul>
                </div>
            </section>
        </main>
    </div>

    <div id="game-screen" class="d-none">
        <header class="p-3">
            <button id="back-btn" type="button" class="btn nehezseg text-white fw-bold">← Vissza a menübe</button>
        </header>
        <main>
            <section>
                <div class="counter fixed-bottom">
                    <div class="kebabGrill"><img src="img/kebab-grill.png" alt="Kebab-grill"></div>
                    <div class="kebabGrill-with-kebab d-none"><img src="img/kebab-grill-with-kebab.png" alt="Kebab-grill-with-kebab"></div>
                    <div class="ingredients-nokebab"><img src="img/ingredients-nokebab.png" alt="ingredients-no-kebab"></div>
                    <div class="ingredients-kebab d-none"><img src="img/ingredients-withkebab.png" alt="ingredients-with-kebab"></div>
                    <div class="empty-plate"><img src="img/empty-plate.png" alt="empty-plate"></div>
                    <div class="kebab-plate d-none"><img src="img/kebab-plate.png" alt="kebab-plate"></div>
                </div>
            </section>
        </main>
    </div>

    <footer></footer>

    <script src="js/bootstrap.bundle.min.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
